name: Build Lucky77

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      run: |
        sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
        xcodebuild -version
        
    - name: Install THEOS
      run: |
        # Устанавливаем THEOS в правильную папку
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH
        # Проверяем, что logos установлен
        ls -la $HOME/theos/bin/
        
    - name: Build dylib
      run: |
        export THEOS=$HOME/theos
        # Проверяем, что файл Tweak.xm существует
        ls -la
        # Преобразуем Tweak.xm в Tweak.mm
        $THEOS/bin/logos Tweak.xm > Tweak.mm
        # Проверяем, что Tweak.mm создан
        ls -la Tweak.mm
        # Собираем .dylib через clang
        SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
        CLANG="$(xcrun --find clang)"
        mkdir -p build
        $CLANG \
          -fobjc-arc \
          -fobjc-weak \
          -fcxx-exceptions \
          -fexceptions \
          -stdlib=libc++ \
          -isysroot "$SDK" \
          -miphoneos-version-min=15.0 \
          -arch arm64 \
          -dynamiclib \
          -framework UIKit \
          -framework AudioToolbox \
          -framework QuartzCore \
          -framework Foundation \
          -framework CoreGraphics \
          -lc++ \
          -ldl \
          Tweak.mm \
          -o build/Lucky77.dylib
        echo "✅ Built: build/Lucky77.dylib"
        
    - name: Upload .dylib
      uses: actions/upload-artifact@v4
      with:
        name: Lucky77.dylib
        path: build/Lucky77.dylib
