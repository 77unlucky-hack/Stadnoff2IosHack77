name: Build Lucky77

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      run: |
        sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
        xcodebuild -version
        
    - name: Build dylib
      run: |
        chmod +x build_dylib.sh
        ./build_dylib.sh
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Lucky77.dylib
        path: build/Lucky77.dylib
