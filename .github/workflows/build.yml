name: Build Lucky77

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      run: |
        sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
        xcodebuild -version
        
    - name: Build dylib
      run: |
        # Устанавливаем THEOS
        git clone --recursive --depth=1 https://github.com/theos/theos.git $HOME/theos
        export THEOS=$HOME/theos
        export PATH=$THEOS/bin:$PATH
        
        # Проверяем, что logos доступен
        which logos
        logos --version || true
        
        # Проверяем, что файл Tweak.xm существует
        ls -la Tweak.xm
        
        # Преобразуем Tweak.xm в Tweak.mm
        logos Tweak.xm > Tweak.mm
        echo "✅ Tweak.mm created"
        ls -la Tweak.mm
        
        # Собираем .dylib через clang
        SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
        CLANG="$(xcrun --find clang)"
        mkdir -p build
        
        $CLANG \
          -fobjc-arc \
          -fobjc-weak \
          -fcxx-exceptions \
          -fexceptions \
          -stdlib=libc++ \
          -isysroot "$SDK" \
          -miphoneos-version-min=15.0 \
          -arch arm64 \
          -dynamiclib \
          -framework UIKit \
          -framework AudioToolbox \
          -framework QuartzCore \
          -framework Foundation \
          -framework CoreGraphics \
          -lc++ \
          -ldl \
          Tweak.mm \
          -o build/Lucky77.dylib
        
        if [ -f "build/Lucky77.dylib" ]; then
          echo "✅ Built: build/Lucky77.dylib"
          file build/Lucky77.dylib
          ls -la build/
        else
          echo "❌ Build failed!"
          exit 1
        fi
        
    - name: Upload .dylib
      uses: actions/upload-artifact@v4
      with:
        name: Lucky77.dylib
        path: build/Lucky77.dylib
