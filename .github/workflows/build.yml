name: Build Lucky77

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      run: |
        sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
        xcodebuild -version
        
    - name: Build dylib
      run: |
        # Устанавливаем THEOS
        git clone --recursive --depth=1 https://github.com/theos/theos.git $HOME/theos
        export THEOS=$HOME/theos
        export PATH=$THEOS/bin:$PATH
        
        # Проверяем, что logos доступен
        echo "🔍 Checking logos..."
        ls -la $THEOS/bin/ || true
        which logos || true
        
        # Если logos не найден в bin, пробуем найти в vendor/logos
        if [ ! -f "$THEOS/bin/logos" ]; then
          echo "logos not found in bin, trying vendor/logos..."
          export LOGOS_PATH="$THEOS/vendor/logos/bin/logos"
          if [ -f "$LOGOS_PATH" ]; then
            echo "✅ Found logos at $LOGOS_PATH"
            chmod +x "$LOGOS_PATH"
            alias logos="$LOGOS_PATH"
          else
            echo "❌ logos not found!"
            exit 1
          fi
        fi
        
        # Проверяем, что файл Tweak.xm существует
        echo "🔍 Checking Tweak.xm..."
        ls -la Tweak.xm || exit 1
        
        # Преобразуем Tweak.xm в Tweak.mm
        echo "🔨 Converting Tweak.xm to Tweak.mm..."
        $THEOS/bin/logos Tweak.xm > Tweak.mm 2>&1 || {
          echo "❌ logos conversion failed!"
          # Пробуем альтернативный путь
          if [ -f "$THEOS/vendor/logos/bin/logos" ]; then
            echo "🔄 Trying alternative logos path..."
            $THEOS/vendor/logos/bin/logos Tweak.xm > Tweak.mm
          else
            exit 1
          fi
        }
        
        if [ -f "Tweak.mm" ]; then
          echo "✅ Tweak.mm created successfully!"
          head -n 10 Tweak.mm
        else
          echo "❌ Tweak.mm was not created!"
          exit 1
        fi
        
        # Собираем .dylib через clang
        echo "🔨 Building .dylib..."
        SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
        CLANG="$(xcrun --find clang)"
        mkdir -p build
        
        $CLANG \
          -fobjc-arc \
          -fobjc-weak \
          -fcxx-exceptions \
          -fexceptions \
          -stdlib=libc++ \
          -isysroot "$SDK" \
          -miphoneos-version-min=15.0 \
          -arch arm64 \
          -dynamiclib \
          -framework UIKit \
          -framework AudioToolbox \
          -framework QuartzCore \
          -framework Foundation \
          -framework CoreGraphics \
          -lc++ \
          -ldl \
          Tweak.mm \
          -o build/Lucky77.dylib
        
        if [ -f "build/Lucky77.dylib" ]; then
          echo "✅ Built: build/Lucky77.dylib"
          file build/Lucky77.dylib
          ls -la build/
        else
          echo "❌ Build failed!"
          exit 1
        fi
        
    - name: Upload .dylib
      uses: actions/upload-artifact@v4
      with:
        name: Lucky77.dylib
        path: build/Lucky77.dylib
